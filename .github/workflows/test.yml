name: CI
on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Module contract
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            printf 'Go files requiring gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Race and unit tests
        run: go test -race -count=1 ./...
      - name: Linux amd64 build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/lighthouse-keeper-linux-amd64 ./cmd/lighthousekeeper
      - name: Linux arm64 build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o /tmp/lighthouse-keeper-linux-arm64 ./cmd/lighthousekeeper
      - name: Named core acceptance
        run: >-
          go test ./internal/game -count=1
          -run 'TestCrossingAlwaysCompletes|TestLitCrossingFasterThanUnlit|TestBeamEasingAndClamp|TestAllBoatPositionsReachableByBeam|TestFogRiseAndClearTimes|TestNoticeLogsOldestVisibleAndBeamUnchanged|TestChaseAfterSixtyTicksUnlogged|TestChimeAfterGraceWhenAlreadyUnlit|TestBellScheduleAlwaysTwoOrThreeOnSlowCrossings|TestRestAfterTwoNightsSameDay|TestParentOverride|TestDeskClockAdvancesAcrossMissedUpdates|TestSaveRoundTrip|TestOversizedSaveRejectedBeforeDecode|TestReplayDeterministic'
